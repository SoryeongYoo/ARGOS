services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: argos-occ:latest
    container_name: argos-dashboard
    ports:
      - "8501:8501"
    volumes:
      # Mount local DuckDB data directory into container
      - ./data:/app/data
      # Mount models so LightGBM predictions work without rebuilding
      - ./models:/app/models
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DUCKDB_PATH=data/db/argos.duckdb
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Optional: run the data generation pipeline before the dashboard
  # docker compose run --rm setup
  setup:
    build:
      context: .
      dockerfile: Dockerfile
    image: argos-occ:latest
    container_name: argos-setup
    volumes:
      - ./data:/app/data
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DUCKDB_PATH=data/db/argos.duckdb
      # generate_data.py 는 --start/--end 가 없으면 DATA_START_DATE/DATA_END_DATE 를 쓴다.
      # 호스트 쪽은 SETUP_* 로 받는다: .env 의 DATA_* (앱 설정용, 3년치) 가 섞이지 않게. CI 는 하루치
      - DATA_START_DATE=${SETUP_START_DATE:-2024-06-01}
      - DATA_END_DATE=${SETUP_END_DATE:-2024-06-30}
    command: >
      sh -c "python scripts/setup_db.py --yes &&
             python scripts/generate_data.py --yes"
    profiles:
      - setup
