<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border-1); padding: 0 4px; }
  .tab { padding: 12px 18px; font: 600 14px/1 var(--font-sans); color: var(--fg-2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: var(--fg-1); border-bottom-color: var(--argos-violet-500); }
  .tab:hover:not(.active) { color: var(--fg-1); }

  .sidenav { background: white; border: 1px solid var(--border-1); border-radius: 12px; padding: 8px; width: 220px; display: flex; flex-direction: column; gap: 2px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; font: 500 13px/1 var(--font-sans); color: var(--fg-2); cursor: pointer; }
  .nav-item .ic { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: 0.5; }
  .nav-item.active { background: var(--bg-tint); color: var(--argos-violet-700); font-weight: 600; }
  .nav-item.active .ic { opacity: 1; }
  .nav-item:hover:not(.active) { background: var(--bg-3); color: var(--fg-1); }

  .row { display: flex; gap: 20px; align-items: flex-start; }
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <div style="flex: 1;">
      <div class="tabs">
        <div class="tab active">OCC Operations</div>
        <div class="tab">UAM / ACROSS</div>
        <div class="tab">Prediction</div>
      </div>
      <div style="margin-top: 16px;">
        <div class="sidenav">
          <div class="nav-item active"><span class="ic"></span>대시보드</div>
          <div class="nav-item"><span class="ic"></span>지연 예측</div>
          <div class="nav-item"><span class="ic"></span>전파 시뮬레이션</div>
          <div class="nav-item"><span class="ic"></span>회복 시나리오</div>
          <div class="nav-item"><span class="ic"></span>UAM / ACROSS</div>
        </div>
      </div>
    </div>
  </div>
  <span class="eyebrow">Navigation · top tabs (violet underline) · left sidebar (violet-100 active)</span>
</div>
</body>
</html>
