[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argos"
version = "0.1.0"
description = "Airline Route & Ground Operations System — AI-powered OCC for Incheon hub"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "duckdb>=1.1.0",
    "lightgbm>=4.5.0",
    "ortools>=9.11.0,<9.12.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "networkx>=3.4.0",
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "typer>=0.13.0",
    "scipy>=1.14.0",
    "faker>=24.0.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# typer 의 표준 CLI 선언 패턴 (B008 오탐 방지)
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# mypy baseline: 아래 모듈은 기존 오류를 무시한다. 고친 모듈은 항목을 지워 strict 로 되돌릴 것.

[[tool.mypy.overrides]]
# baseline: 2026-10-01, 20 errors
module = "argos.agents.occ_graph"
ignore_errors = true

[[tool.mypy.overrides]]
# baseline: 2026-10-01, 1 errors
module = "argos.agents.state"
ignore_errors = true

[[tool.mypy.overrides]]
# baseline: 2026-10-01, 4 errors
module = "argos.agents.tools"
ignore_errors = true

[[tool.mypy.overrides]]
# baseline: 2026-10-01, 8 errors
module = "argos.data_gen.generator"
ignore_errors = true

[[tool.mypy.overrides]]
# baseline: 2026-10-01, 16 errors
module = "argos.data_gen.validator"
ignore_errors = true

[[tool.mypy.overrides]]
# baseline: 2026-10-01, 1 errors
module = "argos.optimization.aircraft"
ignore_errors = true

[[tool.mypy.overrides]]
# baseline: 2026-10-01, 4 errors
module = "argos.prediction.model"
ignore_errors = true

[[tool.mypy.overrides]]
# baseline: 2026-10-01, 1 errors
module = "argos.uav.network"
ignore_errors = true

[[tool.mypy.overrides]]
# baseline: 2026-10-01, 2 errors
module = "argos.ui.dashboard"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "slow: 3초 넘게 걸리는 테스트. `python scripts/verify.py --fast` 에서 제외",
]
