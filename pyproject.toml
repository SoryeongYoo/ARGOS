[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argos"
version = "0.1.0"
description = "Airline Route & Ground Operations System — AI-powered OCC for Incheon hub"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "duckdb>=1.1.0",
    "lightgbm>=4.5.0",
    "ortools>=9.11.0,<9.12.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "networkx>=3.4.0",
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "typer>=0.13.0",
    "scipy>=1.14.0",
    "faker>=24.0.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "import-linter>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# typer 의 표준 CLI 선언 패턴 (B008 오탐 방지)
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# mypy baseline: 아래 모듈은 기존 오류를 무시한다. 고친 모듈은 항목을 지워 strict 로 되돌릴 것.

[[tool.mypy.overrides]]
# baseline: 2026-10-01, 20 errors
module = "argos.agents.occ_graph"
ignore_errors = true

[[tool.mypy.overrides]]
# baseline: 2026-10-01, 1 errors
module = "argos.agents.state"
ignore_errors = true

[[tool.mypy.overrides]]
# baseline: 2026-10-01, 4 errors
module = "argos.agents.tools"
ignore_errors = true

[[tool.mypy.overrides]]
# baseline: 2026-10-01, 8 errors
module = "argos.data_gen.generator"
ignore_errors = true

[[tool.mypy.overrides]]
# baseline: 2026-10-01, 16 errors
module = "argos.data_gen.validator"
ignore_errors = true

[[tool.mypy.overrides]]
# baseline: 2026-10-01, 1 errors
# Solve() 반환 타입: crew.py 의 StatusName 방식 필요 (272a5bb 이후 커밋 참고)
module = "argos.optimization.aircraft"
ignore_errors = true

[[tool.mypy.overrides]]
# baseline: 2026-10-01, 4 errors
module = "argos.prediction.model"
ignore_errors = true

[[tool.mypy.overrides]]
# baseline: 2026-10-01, 1 errors
module = "argos.uav.network"
ignore_errors = true

[[tool.mypy.overrides]]
# baseline: 2026-10-01, 2 errors
module = "argos.ui.dashboard"
ignore_errors = true

# ── 레이어 경계 (docs/architecture/overview.md 레이어 규칙) ─────────────────
# 실행: lint-imports (verify.py 의 "import contracts" 단계)
# ignore_imports 는 현재 위반 baseline 이다. 줄마다 진단 항목 번호를 단다.
# baseline 을 늘리지 말 것. 고친 위반은 줄을 지운다.

[tool.importlinter]
root_package = "argos"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "레이어 방향: ui → agents → 계산·데이터·uav → config → domain"
type = "layers"
layers = [
    "argos.ui",
    "argos.agents",
    "argos.simulation | argos.optimization | argos.data_gen | argos.prediction | argos.uav",
    "argos.config",
    "argos.domain",
]

[[tool.importlinter.contracts]]
id = "compute-domain-only"
name = "계산 레이어(simulation, optimization)는 argos 중 domain 만 import"
type = "forbidden"
source_modules = ["argos.simulation", "argos.optimization"]
forbidden_modules = ["argos.config", "argos.cli_guard"]

[[tool.importlinter.contracts]]
id = "uav-standalone"
name = "uav 는 uav 내부만 import (OCC 와 독립)"
type = "forbidden"
source_modules = ["argos.uav"]
forbidden_modules = ["argos.config", "argos.domain", "argos.cli_guard"]

[[tool.importlinter.contracts]]
id = "cli-guard-entry-only"
name = "cli_guard 는 scripts/ 진입점 전용"
type = "forbidden"
source_modules = [
    "argos.domain",
    "argos.config",
    "argos.data_gen",
    "argos.prediction",
    "argos.simulation",
    "argos.optimization",
    "argos.uav",
    "argos.agents",
    "argos.ui",
]
forbidden_modules = ["argos.cli_guard"]

[[tool.importlinter.contracts]]
id = "no-db-io-in-compute"
name = "domain, 계산, 오케스트레이션 레이어는 DuckDB 를 직접 쓰지 않음"
type = "forbidden"
source_modules = ["argos.domain", "argos.simulation", "argos.optimization", "argos.agents"]
forbidden_modules = ["duckdb"]
ignore_imports = [
    "argos.simulation.propagation -> duckdb",  # D8: DelayPropagator.load_flights, _find_spare_aircraft
    "argos.optimization.aircraft -> duckdb",  # D8: AircraftAssigner.load_from_db
    "argos.agents.tools -> duckdb",  # D8: run_crew_optimisation 의 직접 SQL
]

[[tool.importlinter.contracts]]
id = "llm-via-occ-graph"
name = "Claude 호출은 agents.occ_graph._make_llm 에서만 (conventions LLM 호출)"
type = "forbidden"
source_modules = [
    "argos.domain",
    "argos.config",
    "argos.cli_guard",
    "argos.data_gen",
    "argos.prediction",
    "argos.simulation",
    "argos.optimization",
    "argos.uav",
    "argos.agents.state",
    "argos.agents.tools",
    "argos.ui",
]
forbidden_modules = ["anthropic", "langchain_anthropic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "slow: 3초 넘게 걸리는 테스트. `python scripts/verify.py --fast` 에서 제외",
]
