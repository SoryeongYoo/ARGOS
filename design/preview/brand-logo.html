<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>
  body { padding: 0; }
  .card { padding: 26px 28px; gap: 18px; }
  .logo-row { display: flex; align-items: center; gap: 22px; }
  .logo-row img { display: block; }
  .meta { display: flex; gap: 26px; margin-top: 4px; }
  .meta .item { display: flex; flex-direction: column; gap: 2px; }
  .meta .k { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-2); }
  .meta .v { font-family: var(--font-mono); font-size: 12px; color: var(--fg-1); }
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <img src="../assets/logo-argos.svg" width="280" height="64" alt="ARGOS logo lockup" />
  </div>
  <div class="logo-row" style="gap: 14px;">
    <img src="../assets/argos-glyph.svg" width="48" height="48" alt="ARGOS glyph 48" />
    <img src="../assets/argos-glyph.svg" width="32" height="32" alt="ARGOS glyph 32" />
    <img src="../assets/argos-glyph.svg" width="20" height="20" alt="ARGOS glyph 20" />
    <div style="flex: 1;"></div>
    <div class="meta">
      <div class="item"><span class="k">Mark</span><span class="v">#16161D</span></div>
      <div class="item"><span class="k">Plane</span><span class="v">#8B5CF6</span></div>
      <div class="item"><span class="k">Min size</span><span class="v">20px</span></div>
    </div>
  </div>
</div>
</body>
</html>
