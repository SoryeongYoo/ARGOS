<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
</head>
<body>
<div class="card">
  <div class="scale-grid">
    <div class="swatch light" style="background: var(--argos-n-0);    box-shadow: inset 0 0 0 1px var(--border-1);"><span class="label"><span>0</span></span></div>
    <div class="swatch light" style="background: var(--argos-n-25);   box-shadow: inset 0 0 0 1px var(--border-1);"><span class="label"><span>25</span></span></div>
    <div class="swatch light" style="background: var(--argos-n-50);"><span class="label"><span>50</span></span></div>
    <div class="swatch light" style="background: var(--argos-n-100);"><span class="label"><span>100</span></span></div>
    <div class="swatch light" style="background: var(--argos-n-200);"><span class="label"><span>200</span></span></div>
    <div class="swatch light" style="background: var(--argos-n-300);"><span class="label"><span>300</span></span></div>
    <div class="swatch" style="background: var(--argos-n-400);"><span class="label"><span>400</span></span></div>
    <div class="swatch" style="background: var(--argos-n-500);"><span class="label"><span>500</span></span></div>
    <div class="swatch" style="background: var(--argos-n-700);"><span class="label"><span>700</span></span></div>
    <div class="swatch" style="background: var(--argos-n-900);"><span class="label"><span>900</span></span></div>
  </div>
  <div class="row" style="justify-content: space-between;">
    <span class="eyebrow">Neutral scale · fg / bg / border surfaces</span>
    <span class="mono" style="font-size: 11px; color: var(--fg-2);">--argos-n-{0…900}</span>
  </div>
</div>
</body>
</html>
