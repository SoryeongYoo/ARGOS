<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
</head>
<body>
<div class="card">
  <div class="scale-grid">
    <div class="swatch light" style="background: var(--argos-violet-50);"><span class="label"><span>50</span></span></div>
    <div class="swatch light" style="background: var(--argos-violet-100);"><span class="label"><span>100</span></span></div>
    <div class="swatch light" style="background: var(--argos-violet-200);"><span class="label"><span>200</span></span></div>
    <div class="swatch light" style="background: var(--argos-violet-300);"><span class="label"><span>300</span></span></div>
    <div class="swatch" style="background: var(--argos-violet-400);"><span class="label"><span>400</span></span></div>
    <div class="swatch" style="background: var(--argos-violet-500);"><span class="label"><span>500</span></span></div>
    <div class="swatch" style="background: var(--argos-violet-600);"><span class="label"><span>600</span></span></div>
    <div class="swatch" style="background: var(--argos-violet-700);"><span class="label"><span>700</span></span></div>
    <div class="swatch" style="background: var(--argos-violet-800);"><span class="label"><span>800</span></span></div>
    <div class="swatch" style="background: var(--argos-violet-900);"><span class="label"><span>900</span></span></div>
  </div>
  <div class="row" style="justify-content: space-between;">
    <span class="eyebrow">Violet scale · brand primary at 500</span>
    <span class="mono" style="font-size: 11px; color: var(--fg-2);">--argos-violet-{50…900}</span>
  </div>
</div>
</body>
</html>
