<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>
  .specimen { display: flex; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--border-2); }
  .specimen:last-child { border-bottom: none; }
  .specimen .glyph { flex: 1; color: var(--fg-1); }
  .specimen .meta  { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-2); white-space: nowrap; }
</style>
</head>
<body>
<div class="card">
  <div class="specimen">
    <div class="glyph" style="font-size: 40px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1;">인천 OCC · ARGOS</div>
    <div class="meta">Display · 40 / 700</div>
  </div>
  <div class="specimen">
    <div class="glyph" style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15;">회복 시나리오 3건</div>
    <div class="meta">H1 · 28 / 700</div>
  </div>
  <div class="specimen">
    <div class="glyph" style="font-size: 22px; font-weight: 600; line-height: 1.25;">지연 전파 시뮬레이션</div>
    <div class="meta">H2 · 22 / 600</div>
  </div>
  <div class="specimen">
    <div class="glyph" style="font-size: 18px; font-weight: 600;">Route map</div>
    <div class="meta">H3 · 18 / 600</div>
  </div>
</div>
</body>
</html>
